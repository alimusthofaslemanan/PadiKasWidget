name: Build PadiKasWidget APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Terima Lisensi Android SDK
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "2433370235555b00596a3222796816285d361324" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-arm-dls-license

      # Cari lokasi proyek Android secara otomatis dan jalankan build
      - name: Auto-Detect Project & Build APK
        run: |
          echo "=== Mencari lokasi proyek Android ==="
          TARGET_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" -o -name "gradlew" | head -n 1 | xargs dirname 2>/dev/null)

          if [ -n "$TARGET_DIR" ]; then
            echo "Proyek ditemukan di folder: $TARGET_DIR"
            cd "$TARGET_DIR"
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              gradle assembleDebug
            fi
          else
            echo "Error: File proyek Android tidak ditemukan di repositori!"
            exit 1
          fi

      # Simpan dan unduh file APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadiKasWidget-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
