name: Build PadiKasWidget APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Install package Node.js & build Web
      - name: Install & Build Web
        run: |
          npm install
          npm run build

      # 2. Generate/Sync folder Android via Capacitor
      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 3. Lisensi Android SDK
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "2433370235555b00596a3222796816285d361324" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-arm-dls-license

      # 4. Build APK dari folder android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Simpan APK agar bisa di-download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadiKasWidget-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
